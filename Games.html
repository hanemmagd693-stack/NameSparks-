<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Blocks Game</title>
  <style>
    /* كود التصميم المدمج بالكامل */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      margin: 0;
      background-color: #f6f6f6;
    }

    .control-buttons {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background-color: rgba(3, 169, 244, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .control-buttons span {
      background-color: #F44336;
      color: #FFF;
      padding: 15px 30px;
      font-size: 30px;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
    }

    .info-container {
      width: 1080px;
      margin: 20px auto 0;
      background-color: #FFF;
      padding: 20px;
      font-size: 24px;
      overflow: hidden;
      border: 2px solid #2196F3;
    }

    .info-container .name {
      float: left;
      width: 50%;
    }

    .info-container .tries {
      float: right;
      width: 50%;
      text-align: right;
    }

    .memory-game-blocks {
      display: flex;
      width: 1080px;
      flex-wrap: wrap;
      margin: 20px auto;
    }

    .memory-game-blocks.no-clicking {
      pointer-events: none;
    }

    .memory-game-blocks .game-block {
      height: 200px;
      transition: transform 0.5s;
      transform-style: preserve-3d;
      cursor: pointer;
      position: relative;
      flex: 1 0 200px;
      margin: 0 10px 20px;
    }

    .memory-game-blocks .game-block .face {
      position: absolute;
      width: 100%;
      height: 100%;
      text-align: center;
      backface-visibility: hidden;
      border: 5px solid #2196F3;
    }

    .memory-game-blocks .game-block .front {
      background-color: #333;
      line-height: 190px;
    }

    .memory-game-blocks .game-block .front:before {
      content: '!';
      color: #FFF;
      font-size: 140px;
      font-weight: bold;
    }

    .memory-game-blocks .game-block .back {
      background-color: #FFF;
      transform: rotateY(180deg);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 80px;
    }

    .memory-game-blocks .game-block.is-flipped,
    .memory-game-blocks .game-block.has-match {
      transform: rotateY(180deg);
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="control-buttons">
    <span>Start Game</span>
  </div>

  <div class="info-container">
    <div class="name">Hello: <span></span></div>
    <div class="tries">Wrong Tries: <span>0</span></div>
  </div>

  <div class="memory-game-blocks">
    <!-- رموز النصوص المدمجة -->
    <div class="game-block" data-technology="js">
      <div class="face front"></div>
      <div class="face back">JS</div>
    </div>
    <div class="game-block" data-technology="js">
      <div class="face front"></div>
      <div class="face back">JS</div>
    </div>

    <div class="game-block" data-technology="github">
      <div class="face front"></div>
      <div class="face back">Git</div>
    </div>
    <div class="game-block" data-technology="github">
      <div class="face front"></div>
      <div class="face back">Git</div>
    </div>

    <div class="game-block" data-technology="html">
      <div class="face front"></div>
      <div class="face back">HTML</div>
    </div>
    <div class="game-block" data-technology="html">
      <div class="face front"></div>
      <div class="face back">HTML</div>
    </div>

    <div class="game-block" data-technology="python">
      <div class="face front"></div>
      <div class="face back">PY</div>
    </div>
    <div class="game-block" data-technology="python">
      <div class="face front"></div>
      <div class="face back">PY</div>
    </div>

    <div class="game-block" data-technology="php">
      <div class="face front"></div>
      <div class="face back">PHP</div>
    </div>
    <div class="game-block" data-technology="php">
      <div class="face front"></div>
      <div class="face back">PHP</div>
    </div>

    <div class="game-block" data-technology="ruby">
      <div class="face front"></div>
      <div class="face back">Ruby</div>
    </div>
    <div class="game-block" data-technology="ruby">
      <div class="face front"></div>
      <div class="face back">Ruby</div>
    </div>

    <div class="game-block" data-technology="cplusplus">
      <div class="face front"></div>
      <div class="face back">C++</div>
    </div>
    <div class="game-block" data-technology="cplusplus">
      <div class="face front"></div>
      <div class="face back">C++</div>
    </div>

    <div class="game-block" data-technology="css">
      <div class="face front"></div>
      <div class="face back">CSS</div>
    </div>
    <div class="game-block" data-technology="css">
      <div class="face front"></div>
      <div class="face back">CSS</div>
    </div>
  </div>

  <script>
    document.querySelector(".control-buttons span").onclick = function () {
      let yourName = prompt("What's Your Name?");
      document.querySelector(".info-container .name span").innerHTML = yourName || 'Unknown';
      document.querySelector(".control-buttons").remove();
    };

    let duration = 1000;
    let blocksContainer = document.querySelector(".memory-game-blocks");
    let blocks = Array.from(blocksContainer.children);
    let orderRange = [...Array(blocks.length).keys()];

    shuffle(orderRange);

    blocks.forEach((block, index) => {
      block.style.order = orderRange[index];
      block.addEventListener('click', function () {
        flipBlock(block);
      });
    });

    function flipBlock(selectedBlock) {
      selectedBlock.classList.add('is-flipped');
      let allFlippedBlocks = blocks.filter(b => b.classList.contains('is-flipped'));
      if (allFlippedBlocks.length === 2) {
        stopClicking();
        checkMatchedBlocks(allFlippedBlocks[0], allFlippedBlocks[1]);
      }
    }

    function stopClicking() {
      blocksContainer.classList.add('no-clicking');
      setTimeout(() => { blocksContainer.classList.remove('no-clicking'); }, duration);
    }

    function checkMatchedBlocks(firstBlock, secondBlock) {
      let triesElement = document.querySelector('.tries span');
      if (firstBlock.dataset.technology === secondBlock.dataset.technology) {
        firstBlock.classList.remove('is-flipped');
        secondBlock.classList.remove('is-flipped');
        firstBlock.classList.add('has-match');
        secondBlock.classList.add('has-match');

        // فحص ما إذا كانت جميع الكروت قد تطابقت لإعلان الفوز
        checkGameEnd();
      } else {
        triesElement.innerHTML = parseInt(triesElement.innerHTML) + 1;
        setTimeout(() => {
          firstBlock.classList.remove('is-flipped');
          secondBlock.classList.remove('is-flipped');
        }, duration);
      }
    }

    // الدالة البرمجية الجديدة لفحص شروط الفوز والخسارة المحددة
    function checkGameEnd() {
      let matchedBlocks = blocks.filter(b => b.classList.contains('has-match'));
      if (matchedBlocks.length === blocks.length) {
        let finalTries = parseInt(document.querySelector('.tries span').innerHTML);

        // تأخير التنبيه قليلاً حتى يكتمل تأثير دوران آخر كارت بشكل جميل
        setTimeout(() => {
          if (finalTries < 10) {
            alert(`تهانينا! لقد فزت بـ الكأس الذهبية 🏆\nعدد خساراتك: ${finalTries}`);
          } else {
            alert(`لقد أنهيت اللعبة ولكن خساراتك زادت عن 10. حاول مرة أخرى 🔄\nعدد خساراتك: ${finalTries}`);
          }
        }, 600);
      }
    }

    function shuffle(array) {
      let current = array.length, temp, random;
      while (current > 0) {
        random = Math.floor(Math.random() * current);
        current--;
        temp = array[current];
        array[current] = array[random];
        array[random] = temp;
      }
      return array;
    }
  </script>
</body>

</html>
